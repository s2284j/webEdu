<!-- menu.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart | Menu</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🍔 FoodCart</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="login.html">Login</a>
      </nav>
      <div class="cart-icon-wrap">
        <a href="cart.html" class="cart-icon">🛒 <span id="cartCount" class="cart-count">0</span></a>
      </div>
      <button class="mobile-toggle" id="mobileToggle">☰</button>
    </div>
  </header>

  <main class="container section">
    <h1 class="page-title">Our Menu</h1>
    <p class="page-subtitle">Browse our delicious selection</p>

    <!-- Search & Filters -->
    <div class="menu-controls">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search menu..." class="search-input">
      </div>
      <div class="category-filters" id="categoryFilters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="Burgers">Burgers</button>
        <button class="filter-btn" data-category="Pizza">Pizza</button>
        <button class="filter-btn" data-category="Snacks">Snacks</button>
        <button class="filter-btn" data-category="Drinks">Drinks</button>
        <button class="filter-btn" data-category="Desserts">Desserts</button>
      </div>
    </div>

    <!-- Food Grid -->
    <div class="food-grid" id="foodGrid">
      <!-- Populated by JS -->
    </div>
    <div id="emptyMenu" class="empty-state" style="display:none;">
      <span class="empty-icon">🍽️</span>
      <p>No items match your search.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 FoodCart System. All rights reserved.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="login.html">Admin</a>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="data/seed-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuItems = getMenuItems();
      let currentCategory = 'all';
      let searchTerm = '';

      // Check URL params for category
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('category');
      if (catParam) {
        currentCategory = catParam;
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.category === catParam);
        });
      }

      function renderMenu() {
        const filtered = menuItems.filter(item => {
          const matchCat = currentCategory === 'all' || item.category === currentCategory;
          const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.description.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCat && matchSearch;
        });

        const grid = document.getElementById('foodGrid');
        const empty = document.getElementById('emptyMenu');

        if (filtered.length === 0) {
          grid.innerHTML = '';
          empty.style.display = 'block';
        } else {
          empty.style.display = 'none';
          grid.innerHTML = filtered.map(item => createFoodCard(item)).join('');
        }

        // Re-attach events
        document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const id = parseInt(btn.dataset.id);
            addToCart(id);
          });
        });
      }

      // Search
      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderMenu();
      });

      // Category filters
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.category;
          renderMenu();
        });
      });

      // Initial render
      renderMenu();
      updateCartCount();
    });
  </script>
</body>
</html>
