<!-- cart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart | Your Cart</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🍔 FoodCart</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="login.html">Login</a>
      </nav>
      <div class="cart-icon-wrap">
        <a href="cart.html" class="cart-icon active">🛒 <span id="cartCount" class="cart-count">0</span></a>
      </div>
      <button class="mobile-toggle" id="mobileToggle">☰</button>
    </div>
  </header>

  <main class="container section">
    <h1 class="page-title">Your Cart</h1>

    <div class="cart-layout" id="cartLayout">
      <!-- Cart items -->
      <div class="cart-items" id="cartItems"></div>
      <!-- Summary -->
      <div class="cart-summary" id="cartSummary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="summary-row"><span>Delivery Fee</span><span id="deliveryFee">$2.99</span></div>
        <div class="summary-row total"><span>Total</span><span id="grandTotal">$0.00</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" id="checkoutBtn">Proceed to Checkout</a>
        <a href="menu.html" class="btn btn-outline btn-block">Continue Shopping</a>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyCart" class="empty-state" style="display:none;">
      <span class="empty-icon">🛒</span>
      <h2>Your cart is empty</h2>
      <p>Add some delicious items from our menu.</p>
      <a href="menu.html" class="btn btn-primary">Browse Menu</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 FoodCart System. All rights reserved.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="login.html">Admin</a>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="data/seed-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/cart.js"></script>
</body>
</html>
