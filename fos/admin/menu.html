<!-- admin/menu.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart | Admin Menu</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="logo">🍔 FoodCart</a>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="menu.html" class="active">🍔 Menu Items</a>
      <a href="orders.html">📦 Orders</a>
      <a href="customers.html">👥 Customers</a>
      <a href="reports.html">📈 Reports</a>
      <a href="#" id="logoutBtn">🚪 Logout</a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <h1>Menu Management</h1>
      <button class="btn btn-primary btn-sm" id="addItemBtn">+ Add New Item</button>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-search-wrap">
            <input type="text" id="adminMenuSearch" placeholder="Search items..." class="search-input">
          </div>
          <div class="admin-filters">
            <select id="adminCategoryFilter" class="form-select">
              <option value="all">All Categories</option>
              <option value="Burgers">Burgers</option>
              <option value="Pizza">Pizza</option>
              <option value="Snacks">Snacks</option>
              <option value="Drinks">Drinks</option>
              <option value="Desserts">Desserts</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="admin-table" id="menuTable">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Item</h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <form id="itemForm" class="modal-body">
        <input type="hidden" id="editItemId">
        <div class="form-group">
          <label for="itemName">Item Name *</label>
          <input type="text" id="itemName" required>
        </div>
        <div class="form-group">
          <label for="itemCategory">Category *</label>
          <select id="itemCategory" required>
            <option value="">Select...</option>
            <option value="Burgers">Burgers</option>
            <option value="Pizza">Pizza</option>
            <option value="Snacks">Snacks</option>
            <option value="Drinks">Drinks</option>
            <option value="Desserts">Desserts</option>
          </select>
        </div>
        <div class="form-group">
          <label for="itemPrice">Price ($) *</label>
          <input type="number" id="itemPrice" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <label for="itemDescription">Description</label>
          <textarea id="itemDescription" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="itemAvailable" checked>
            <span>Available</span>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="modalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Confirm Delete</h2>
        <button class="modal-close" id="deleteModalClose">✕</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="deleteItemName"></strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="deleteCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="deleteConfirm">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../data/seed-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Auth check
      if (localStorage.getItem('fc_admin_logged_in') !== 'true') {
        window.location.href = '../login.html';
        return;
      }

      // Sidebar
      const sidebar = document.getElementById('adminSidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const toggle = document.getElementById('sidebarToggle');
      const close = document.getElementById('sidebarClose');
      function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
      function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
      toggle.addEventListener('click', openSidebar);
      close.addEventListener('click', closeSidebar);
      overlay.addEventListener('click', closeSidebar);

      document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm('Logout?')) {
          localStorage.removeItem('fc_admin_logged_in');
          window.location.href = '../login.html';
        }
      });

      // Menu Management
      let menuItems = getMenuItems();
      let searchTerm = '';
      let categoryFilter = 'all';
      let deleteTargetId = null;

      const tableBody = document.querySelector('#menuTable tbody');
      const modal = document.getElementById('itemModal');
      const modalTitle = document.getElementById('modalTitle');
      const itemForm = document.getElementById('itemForm');
      const deleteModal = document.getElementById('deleteModal');

      function renderTable() {
        const filtered = menuItems.filter(item => {
          const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
          const matchCat = categoryFilter === 'all' || item.category === categoryFilter;
          return matchSearch && matchCat;
        });

        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="6" class="text-center">No items found</td></tr>';
          return;
        }

        tableBody.innerHTML = filtered.map(item => `
          <tr>
            <td><div class="table-img-placeholder">${item.image ? '🍔' : '🍽️'}</div></td>
            <td>${item.name}</td>
            <td>${item.category}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>
              <label class="toggle-switch">
                <input type="checkbox" ${item.available ? 'checked' : ''} data-id="${item.id}" class="availability-toggle">
                <span class="toggle-slider"></span>
              </label>
            </td>
            <td class="actions-cell">
              <button class="btn-icon edit-btn" data-id="${item.id}" title="Edit">✏️</button>
              <button class="btn-icon delete-btn" data-id="${item.id}" title="Delete">🗑️</button>
            </td>
          </tr>
        `).join('');

        // Attach events
        document.querySelectorAll('.availability-toggle').forEach(toggle => {
          toggle.addEventListener('change', (e) => {
            const id = parseInt(e.target.dataset.id);
            const item = menuItems.find(i => i.id === id);
            if (item) {
              item.available = e.target.checked;
              saveMenuItems(menuItems);
              showToast('Availability updated', 'success');
            }
          });
        });

        document.querySelectorAll('.edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = parseInt(btn.dataset.id);
            openEditModal(id);
          });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = parseInt(btn.dataset.id);
            const item = menuItems.find(i => i.id === id);
            if (item) {
              deleteTargetId = id;
              document.getElementById('deleteItemName').textContent = item.name;
              deleteModal.classList.add('active');
            }
          });
        });
      }

      function openAddModal() {
        modalTitle.textContent = 'Add New Item';
        document.getElementById('editItemId').value = '';
        itemForm.reset();
        document.getElementById('itemAvailable').checked = true;
        modal.classList.add('active');
      }

      function openEditModal(id) {
        const item = menuItems.find(i => i.id === id);
        if (!item) return;
        modalTitle.textContent = 'Edit Item';
        document.getElementById('editItemId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemDescription').value = item.description;
        document.getElementById('itemAvailable').checked = item.available;
        modal.classList.add('active');
      }

      // Add item button
      document.getElementById('addItemBtn').addEventListener('click', openAddModal);

      // Modal close
      document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('active'));
      document.getElementById('modalCancel').addEventListener('click', () => modal.classList.remove('active'));

      // Form submit
      itemForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('editItemId').value;
        const name = document.getElementById('itemName').value.trim();
        const category = document.getElementById('itemCategory').value;
        const price = parseFloat(document.getElementById('itemPrice').value);
        const description = document.getElementById('itemDescription').value.trim();
        const available = document.getElementById('itemAvailable').checked;

        if (!name || !category || isNaN(price) || price < 0) {
          showToast('Please fill all required fields correctly', 'error');
          return;
        }

        if (editId) {
          // Edit
          const id = parseInt(editId);
          const item = menuItems.find(i => i.id === id);
          if (item) {
            item.name = name;
            item.category = category;
            item.price = price;
            item.description = description;
            item.available = available;
          }
          showToast('Item updated successfully', 'success');
        } else {
          // Add
          const newId = menuItems.length > 0 ? Math.max(...menuItems.map(i => i.id)) + 1 : 1;
          menuItems.push({
            id: newId,
            name,
            category,
            price,
            image: 'assets/images/placeholder.jpg',
            description,
            available
          });
          showToast('Item added successfully', 'success');
        }

        saveMenuItems(menuItems);
        modal.classList.remove('active');
        renderTable();
      });

      // Delete
      document.getElementById('deleteModalClose').addEventListener('click', () => deleteModal.classList.remove('active'));
      document.getElementById('deleteCancel').addEventListener('click', () => deleteModal.classList.remove('active'));
      document.getElementById('deleteConfirm').addEventListener('click', () => {
        if (deleteTargetId) {
          menuItems = menuItems.filter(i => i.id !== deleteTargetId);
          saveMenuItems(menuItems);
          deleteModal.classList.remove('active');
          renderTable();
          showToast('Item deleted', 'success');
          deleteTargetId = null;
        }
      });

      // Search and filter
      document.getElementById('adminMenuSearch').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderTable();
      });
      document.getElementById('adminCategoryFilter').addEventListener('change', (e) => {
        categoryFilter = e.target.value;
        renderTable();
      });

      // Initial render
      renderTable();
    });
  </script>
</body>
</html>
