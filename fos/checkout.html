<!-- checkout.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart | Checkout</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🍔 FoodCart</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="login.html">Login</a>
      </nav>
      <div class="cart-icon-wrap">
        <a href="cart.html" class="cart-icon">🛒 <span id="cartCount" class="cart-count">0</span></a>
      </div>
      <button class="mobile-toggle" id="mobileToggle">☰</button>
    </div>
  </header>

  <main class="container section">
    <h1 class="page-title">Checkout</h1>

    <div class="checkout-layout" id="checkoutLayout">
      <!-- Form -->
      <div class="checkout-form-wrap">
        <form id="checkoutForm" novalidate>
          <h3>Delivery Information</h3>
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" required placeholder="John Doe">
            <span class="error-msg" id="err-fullName"></span>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" required placeholder="03001234567">
            <span class="error-msg" id="err-phone"></span>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label for="address">Delivery Address *</label>
            <input type="text" id="address" required placeholder="House 123, Street 4">
            <span class="error-msg" id="err-address"></span>
          </div>
          <div class="form-group">
            <label for="city">City/Area *</label>
            <input type="text" id="city" required placeholder="Karachi">
            <span class="error-msg" id="err-city"></span>
          </div>
          <h3>Payment Method</h3>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="Cash on Delivery" checked>
              <span>Cash on Delivery</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="Online Payment">
              <span>Online Payment (Demo)</span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="placeOrderBtn">Place Order</button>
        </form>
      </div>
      <!-- Summary -->
      <div class="checkout-summary">
        <h3>Order Summary</h3>
        <div id="checkoutItems"></div>
        <div class="summary-row"><span>Subtotal</span><span id="checkoutSubtotal">$0.00</span></div>
        <div class="summary-row"><span>Delivery Fee</span><span id="checkoutDelivery">$2.99</span></div>
        <div class="summary-row total"><span>Total</span><span id="checkoutTotal">$0.00</span></div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyCheckout" class="empty-state" style="display:none;">
      <span class="empty-icon">🛒</span>
      <h2>Your cart is empty</h2>
      <p>Add items before checking out.</p>
      <a href="menu.html" class="btn btn-primary">Browse Menu</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 FoodCart System. All rights reserved.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="login.html">Admin</a>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="data/seed-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
