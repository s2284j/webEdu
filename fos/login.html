<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart | Admin Login</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
    }
    .login-card h1 {
      text-align: center;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .login-card p {
      text-align: center;
      color: var(--gray);
      margin-bottom: 30px;
    }
    .login-card .form-group {
      margin-bottom: 20px;
    }
    .login-card .btn {
      width: 100%;
      margin-top: 10px;
    }
    .login-hint {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--gray);
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
    }
    .login-hint code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>🍔 FoodCart</h1>
      <p>Admin Panel Login</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="admin@foodcart.local" required>
          <span class="error-msg" id="err-loginEmail"></span>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="admin123" required>
          <span class="error-msg" id="err-loginPassword"></span>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
      <div class="login-hint">
        Demo: <code>admin@foodcart.local</code> / <code>admin123</code>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="data/seed-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      if (localStorage.getItem('fc_admin_logged_in') === 'true') {
        window.location.href = 'admin/dashboard.html';
        return;
      }

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        let valid = true;
        document.querySelectorAll('.error-msg').forEach(el => el.textContent = '');

        if (!email) {
          document.getElementById('err-loginEmail').textContent = 'Email is required';
          valid = false;
        }
        if (!password) {
          document.getElementById('err-loginPassword').textContent = 'Password is required';
          valid = false;
        }

        if (!valid) return;

        if (email === 'admin@foodcart.local' && password === 'admin123') {
          localStorage.setItem('fc_admin_logged_in', 'true');
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'admin/dashboard.html';
          }, 800);
        } else {
          showToast('Invalid email or password', 'error');
        }
      });
    });
  </script>
</body>
</html>
